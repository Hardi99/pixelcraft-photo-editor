default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# DATABASE_URL (dev/prod) est fusionnée automatiquement par Rails.
# Les tests ont leur propre URL pour ne jamais toucher la base de dev.
development:
  <<: *default
  database: photo_editor_dev

test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"] %>
  database: photo_editor_test

production:
  <<: *default
